name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o sebar ./cmd/sebar

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sebar-linux-arm64
          path: sebar
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build (linux/arm64 for VPS)
        run: GOOS=linux GOARCH=arm64 go build -o sebar ./cmd/sebar

      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 6746 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -P 6746 sebar \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:_audit/Sebar/sebar.new

      - name: Atomic swap + restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 6746
          script: |
            set -e
            cd ~/_audit/Sebar
            chmod +x sebar.new
            mv sebar.new sebar
            sudo systemctl restart sebar
            sleep 3
            sudo systemctl is-active sebar
            curl -fsS http://localhost:3000/health
